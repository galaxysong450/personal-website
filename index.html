<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qilei · 个人网站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <p class="brand">Qilei</p>
    <nav>
      <a href="#about">关于</a>
      <a href="#calculator">计算器</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="about">
      <h1 class="brand-hero">Qilei</h1>
      <p class="tagline">产品经理 · 喜欢把想法做成可用的东西</p>
      <p class="intro">这是一个用纯 HTML、CSS 和 JavaScript 搭建的个人小站。下面有一个网页计算器，方便随时算一算。</p>
    </section>

    <section class="calculator-section" id="calculator">
      <h2>计算器</h2>
      <p class="section-desc">加减乘除，本地即时运算</p>

      <div class="calculator" role="application" aria-label="计算器">
        <div class="display" id="display" aria-live="polite">0</div>
        <div class="keys">
          <button type="button" class="key key-func" data-action="clear">AC</button>
          <button type="button" class="key key-func" data-action="sign">±</button>
          <button type="button" class="key key-func" data-action="percent">%</button>
          <button type="button" class="key key-op" data-action="operator" data-value="/">÷</button>

          <button type="button" class="key" data-action="digit" data-value="7">7</button>
          <button type="button" class="key" data-action="digit" data-value="8">8</button>
          <button type="button" class="key" data-action="digit" data-value="9">9</button>
          <button type="button" class="key key-op" data-action="operator" data-value="*">×</button>

          <button type="button" class="key" data-action="digit" data-value="4">4</button>
          <button type="button" class="key" data-action="digit" data-value="5">5</button>
          <button type="button" class="key" data-action="digit" data-value="6">6</button>
          <button type="button" class="key key-op" data-action="operator" data-value="-">−</button>

          <button type="button" class="key" data-action="digit" data-value="1">1</button>
          <button type="button" class="key" data-action="digit" data-value="2">2</button>
          <button type="button" class="key" data-action="digit" data-value="3">3</button>
          <button type="button" class="key key-op" data-action="operator" data-value="+">+</button>

          <button type="button" class="key key-zero" data-action="digit" data-value="0">0</button>
          <button type="button" class="key" data-action="decimal">.</button>
          <button type="button" class="key key-eq" data-action="equals">=</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 Qilei</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
